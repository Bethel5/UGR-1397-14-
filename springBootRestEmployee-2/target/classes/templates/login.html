<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Registration</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#" th:href="@{/}">Login</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container" style="margin-top: 80px;">
        <div class="row">
            <div class="col-md-6 mx-auto">
				<div th:if="${param.logout}">
					<div class="alert alert-info">You have been logged out!</div>
				</div>
				<h1 class="text-center">Login</h1>

				        <form th:action="@{/login}" method="post" th:object="${user}" class="col-md-6 mx-auto">
							
							<div th:if="${param.error}">
								<div class="alert alert-danger">Invalid username or password</div>
							</div>
														

				            <div class="form-group">
				                <label for="email">Email</label>
				                <input type="text" id="email" name="username" class="form-control" placeholder="Enter email" />
				            </div>

				            <div class="form-group">
				                <label for="password">Password</label>
				                <input id="password" class="form-control" name="password"  type="password" placeholder="Enter Password" />
				            </div>
							
				            <div class="form-group text-center">
				                <button type="submit" class="btn btn-primary w-50">Login</button>
				            </div>
							<span>Don't' have an account? <a href="/" th:href="@{/registration}">Register</a></span>
				        </form>
            </div>
        </div>        
    </div>

    <!-- Bootstrap JS & jQuery -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
</body>
</html>
